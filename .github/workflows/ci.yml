name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and unit tests
        run: pnpm check
      - name: Production build
        run: pnpm build

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - name: Byte-compile and import the agent
        working-directory: agent
        run: |
          python -m py_compile main.py calcom.py supabase_config.py
          python -c "import main"
      - name: Build the container image
        run: docker build --platform linux/amd64 -t clinic-agent:ci agent
